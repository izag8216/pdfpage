<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#2980b9"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b59b6"/>
      <stop offset="100%" stop-color="#8e44ad"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ecf0f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="12" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#2d2d44" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Left PDF document icon -->
  <g transform="translate(120, 120)" filter="url(#shadow)">
    <rect width="140" height="180" rx="10" fill="url(#redGrad)"/>
    <rect x="15" y="25" width="90" height="14" rx="3" fill="#fff" opacity="0.95"/>
    <rect x="15" y="50" width="110" height="8" rx="2" fill="#fff" opacity="0.5"/>
    <rect x="15" y="68" width="80" height="8" rx="2" fill="#fff" opacity="0.4"/>
    <rect x="15" y="86" width="100" height="8" rx="2" fill="#fff" opacity="0.4"/>
    <rect x="15" y="104" width="60" height="8" rx="2" fill="#fff" opacity="0.3"/>
    <rect x="15" y="122" width="85" height="8" rx="2" fill="#fff" opacity="0.3"/>
    <rect x="15" y="140" width="50" height="8" rx="2" fill="#fff" opacity="0.25"/>
    <!-- Folded corner -->
    <path d="M 128 0 L 140 0 L 140 12 Z" fill="#922b21"/>
    <path d="M 128 0 L 140 12 L 128 12 Z" fill="#c0392b"/>
  </g>

  <!-- Arrow 1: Extract -->
  <g filter="url(#glow)">
    <path d="M 280 210 L 360 210" stroke="#3498db" stroke-width="4" stroke-linecap="round"/>
    <polygon points="375,210 350,195 350,225" fill="#3498db"/>
  </g>

  <!-- Center: Split pages -->
  <g transform="translate(380, 130)" filter="url(#shadow)">
    <!-- Top page -->
    <rect width="100" height="70" rx="6" fill="url(#pageGrad)"/>
    <rect x="12" y="15" width="55" height="6" rx="2" fill="#bdc3c7"/>
    <rect x="12" y="28" width="40" height="4" rx="1" fill="#d0d5d9"/>
    <rect x="12" y="38" width="50" height="4" rx="1" fill="#d0d5d9"/>
    <rect x="12" y="48" width="35" height="4" rx="1" fill="#d0d5d9"/>

    <!-- Bottom page -->
    <rect y="80" width="100" height="70" rx="6" fill="url(#pageGrad)" opacity="0.9"/>
    <rect x="12" y="15" width="55" height="6" rx="2" fill="#bdc3c7"/>
    <rect x="12" y="28" width="40" height="4" rx="1" fill="#d0d5d9"/>
    <rect x="12" y="38" width="50" height="4" rx="1" fill="#d0d5d9"/>
    <rect x="12" y="48" width="35" height="4" rx="1" fill="#d0d5d9"/>
  </g>

  <!-- Arrow 2: Merge -->
  <g filter="url(#glow)">
    <path d="M 500 210 L 580 210" stroke="#2ecc71" stroke-width="4" stroke-linecap="round"/>
    <polygon points="595,210 570,195 570,225" fill="#2ecc71"/>
  </g>

  <!-- Right: Merged PDF document -->
  <g transform="translate(610, 120)" filter="url(#shadow)">
    <rect width="140" height="180" rx="10" fill="url(#greenGrad)"/>
    <rect x="15" y="25" width="90" height="14" rx="3" fill="#fff" opacity="0.95"/>
    <rect x="15" y="50" width="110" height="8" rx="2" fill="#fff" opacity="0.5"/>
    <rect x="15" y="68" width="80" height="8" rx="2" fill="#fff" opacity="0.4"/>
    <rect x="15" y="86" width="100" height="8" rx="2" fill="#fff" opacity="0.4"/>
    <rect x="15" y="104" width="60" height="8" rx="2" fill="#fff" opacity="0.3"/>
    <rect x="15" y="122" width="85" height="8" rx="2" fill="#fff" opacity="0.3"/>
    <rect x="15" y="140" width="50" height="8" rx="2" fill="#fff" opacity="0.25"/>
    <!-- Folded corner -->
    <path d="M 128 0 L 140 0 L 140 12 Z" fill="#1e8449"/>
    <path d="M 128 0 L 140 12 L 128 12 Z" fill="#27ae60"/>
  </g>

  <!-- Arrow 3: Rotate -->
  <g filter="url(#glow)">
    <path d="M 770 210 L 850 210" stroke="#f39c12" stroke-width="4" stroke-linecap="round"/>
    <polygon points="865,210 840,195 840,225" fill="#f39c12"/>
  </g>

  <!-- Far right: Rotated PDF -->
  <g transform="translate(880, 120)" filter="url(#shadow)">
    <rect width="140" height="180" rx="10" fill="url(#purpleGrad)" transform="rotate(5, 950, 210)"/>
    <rect x="15" y="25" width="90" height="14" rx="3" fill="#fff" opacity="0.95"/>
    <rect x="15" y="50" width="110" height="8" rx="2" fill="#fff" opacity="0.5"/>
    <rect x="15" y="68" width="80" height="8" rx="2" fill="#fff" opacity="0.4"/>
    <rect x="15" y="86" width="100" height="8" rx="2" fill="#fff" opacity="0.4"/>
    <!-- Rotation indicator -->
    <path d="M 110 30 Q 130 50 110 70" stroke="#f1c40f" stroke-width="2" fill="none"/>
    <polygon points="108,68 115,58 105,60" fill="#f1c40f"/>
  </g>

  <!-- Bottom feature labels -->
  <g font-family="monospace" font-size="11" font-weight="bold">
    <text x="190" y="350" fill="#e74c3c" text-anchor="middle">EXTRACT</text>
    <text x="430" y="350" fill="#3498db" text-anchor="middle">SPLIT</text>
    <text x="680" y="350" fill="#2ecc71" text-anchor="middle">MERGE</text>
    <text x="950" y="350" fill="#f39c12" text-anchor="middle">ROTATE</text>
  </g>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" rx="0" fill="#e74c3c" opacity="0.8"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="396" width="1200" height="4" rx="0" fill="#e74c3c" opacity="0.8"/>
</svg>